name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          names=['RECORD_AUDIO','POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','QUERY_ALL_PACKAGES','VIBRATE']
          add=''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in names)
          if 'QUERY_ALL_PACKAGES' not in s:
              s=s.replace('<application', add+'    <application', 1)
          open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: charactr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
