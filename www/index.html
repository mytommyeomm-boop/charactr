</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);

{id:'gem',name:'Google Gemini',url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',list:'https://generativelanguage.googleapis.com/v1beta/openai/models',model:'gemini-flash-latest',key:true,site:'https://aistudio.google.com/apikey',caps:{th:'เร็ว ภาษาไทยดี',en:'Fast, strong Thai'},lim:{th:'ฟรีด้วยคีย์จาก AI Studio มีโควตาต่อนาทีและต่อวัน',en:'Free tier with an AI Studio key; per-minute and daily quotas'}},
{id:'groq',name:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',list:'https://api.groq.com/openai/v1/models',model:'llama-3.3-70b-versatile',key:true,site:'https://console.groq.com/keys',caps:{th:'เร็วมาก เหมาะแชทต่อเนื่อง',en:'Very fast, good for long chats'},lim:{th:'ฟรีด้วยคีย์ มีโควตาต่อนาทีและต่อวัน',en:'Free tier with a key; per-minute and daily quotas'}},
{id:'or',name:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',list:'https://openrouter.ai/api/v1/models',model:'meta-llama/llama-3.3-70b-instruct:free',key:true,site:'https://openrouter.ai/keys',caps:{th:'โมเดลฟรีหลายตัว (ลงท้าย :free)',en:'Many free models (ending in :free)'},lim:{th:'แสดงเฉพาะโมเดล :free มีจำกัดต่อนาทีและต่อวัน',en:'Only :free models listed; per-minute and daily caps'}}];
const PER={
friendly:{n:['Friendly','ร่าเริง'],d:'Cheerful, warm, helpful and easy to talk to. Asks caring follow-up questions. Bright, friendly tone.'},

calm:{n:['Calm','สงบ'],d:'Quiet, logical and thoughtful. Never rushes, gives grounded perspective. Soft, measured, simple precise words.'},

intelligent:{n:['Intelligent','อัจฉริยะ'],d:'Analytical, knowledgeable and serious. Explains clearly with structure and evidence. Formal, concise, logical.'},

const T={th:{ph:'พิมพ์ข้อความ...',persona:'บุคลิก',models:'โมเดล',fb:'สลับไปโมเดลอื่นอัตโนมัติเมื่อล้มเหลว',test:'ทดสอบ',ready:'พร้อมใช้',needkey:'ต้องใส่คีย์',getkey:'รับคีย์ฟรี',save:'บันทึก',name:'ชื่อ AI',cust:'อธิบายบุคลิกและวิธีพูดที่ต้องการ',mem:'ความทรงจำเกี่ยวกับคุณ (แก้ได้)',clr:'ล้างแชททั้งหมด?',stop:'หยุด',editing:'กำลังแก้ข้อความ',hi:'ทักทายได้เลย',nokey:'ยังไม่มีโมเดลที่พร้อมใช้ ใส่คีย์ในหน้าโมเดล',e401:'คีย์ไม่ถูกต้องหรือหมดอายุ',e429:'ใช้เกินโควตาฟรี รอสักครู่หรือเปลี่ยนโมเดล',e5:'เซิร์ฟเวอร์ของโมเดลมีปัญหา',enet:'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต',keysnote:'คีย์และแชทเก็บในเครื่องนี้เท่านั้น ส่งเฉพาะไปยังผู้ให้บริการที่คุณเลือก',model:'โมเดล',custm:'หรือพิมพ์ชื่อโมเดลเอง',load:'โหลดรายชื่อโมเดล',used:'สลับไปใช้',lv:['คนแปลกหน้','คนรู้จัก','เพื่อน','เพื่อนสนิท','คนสำคัญ','ใจตรงกัน'],retry:'ลองใหม่',clear:'ล้าง',regen:'สร้างใหม่',edit:'แก้ไข',lang:'EN',rel:'ความสัมพันธ์',cm:'ล้างความทรงจำ'},
en:{ph:'Type a message...',persona:'Persona',models:'Models',fb:'Switch to another model automatically on failure',test:'Test',ready:'Ready',needkey:'Key needed',getkey:'Get a free key',save:'Save',name:'AI name',cust:'Describe the personality and way of speaking',mem:'What it remembers about you (editable)',clr:'Clear the whole chat?',stop:'Stop',editing:'Editing message',hi:'Say hi to start',nokey:'No model is ready. Add a key in Models',e401:'Key is invalid or expired',e429:'Free quota used up. Wait a bit or switch model',e5:'The model server is having trouble',enet:'Cannot connect. Check your internet',keysnote:'Keys and chats stay on this device and are sent only to the provider you pick.',model:'Model',custm:'Or type a model name',load:'Load model list',used:'Switched to',lv:['Strangers','Acquaintances','Friends','Close friends','Best friends','Soulmates'],retry:'Retry',clear:'Clear',regen:'Regenerate',edit:'Edit',lang:'TH',rel:'Bond',cm:'Clear memory'}};
let S,busy=false,ctl=null,editIdx=null;
try{S=JSON.parse(localStorage.getItem('acs2'))}catch{}
if(!S||!S.chat)S={name:'Mika',per:'friendly',custom:'',mem:'',xp:0,chat:[],keys:{},models:{},lists:{},sel:'poll',fb:true,lang:/^th/.test(navigator.language)?'th':'en'};
const t=k=>T[S.lang][k],L=()=>S.lang==='th'?1:0;
const save=()=>{try{localStorage.setItem('acs2',JSON.stringify(S))}catch{toast('Storage full')}};
const prov=()=>P.find(p=>p.id===S.sel)||P[0],mdl=p=>S.models[p.id]||p.model,ready=p=>!p.key||!!S.keys[p.id];
const lvl=()=>Math.min(5,Math.floor(S.xp/10));
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e)}e.textContent=m;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,3200)}
/* AI calls */
async function call(p,msgs,onTok,sig,stream){
 const h={'Content-Type':'application/json'};if(p.key)h.Authorization='Bearer '+S.keys[p.id];
 const r=await fetch(p.url,{method:'POST',headers:h,signal:sig,body:JSON.stringify({model:mdl(p),messages:msgs,stream,temperature:.9})});
 if(!r.ok){let d='';try{d=await r.text();try{const j=JSON.parse(d);d=(j.error||j[0]?.error||{}).message||d}catch{}}catch{}d=d.slice(0,400);throw Object.assign(new Error(d),{status:r.status})}
 if(!stream){const j=await r.json();const x=j.choices?.[0]?.message?.content;if(!x)throw new Error('empty reply');return x}
 const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;try{const x=JSON.parse(d).choices?.[0]?.delta?.content;if(x){full+=x;onTok(full)}}catch{}}}
 if(!full)throw new Error('empty reply');return full}
function explain(e){const s=e.status;if(s===401||s===403)return t('e401');if(s===429)return t('e429');if(s>=500)return t('e5');
 if(s)return 'HTTP '+s+(e.message?': '+e.message.replace(/\s+/g,' '):'');if(e instanceof TypeError)return t('enet');return e.message}
async function fetchList(p){const r=await fetch(p.list,{headers:p.key&&S.keys[p.id]?{Authorization:'Bearer '+S.keys[p.id]}:{}});if(!r.ok)throw Object.assign(new Error(),{status:r.status});
 const j=await r.json();let a=(Array.isArray(j)?j:j.data||[]).map(x=>typeof x==='string'?x:(x.id||x.name)).filter(Boolean).map(x=>x.replace(/^models\//,''));
 if(p.id==='or')a=a.filter(x=>x.endsWith(':free'));if(p.id==='gem')a=a.filter(x=>/^gemini/.test(x)&&!/image|tts|live|audio|embed|vision/.test(x));return a.sort()}
async function heal(p){try{const a=await fetchList(p);if(!a.length)return false;S.lists[p.id]=a;if(a.includes(mdl(p)))return false;
 const pick=p.id==='gem'?(a.find(x=>x==='gemini-flash-latest')||a.find(x=>/^gemini-[\d.]+-flash$/.test(x))||a.find(x=>/flash/.test(x))):p.id==='groq'?a.find(x=>/llama.*versatile/.test(x)):0;
 S.models[p.id]=pick||a[0];save();toast(p.name+': '+S.models[p.id]);return true}catch{return false}}
async function run(msgs,onTok,sig,stream){
 const order=[prov(),...(S.fb?P.filter(p=>p!==prov()):[])].filter(ready);if(!order.length)throw new Error(t('nokey'));
 const errs=[];
 for(const p of order){for(let k=0;k<2;k++){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),stream?90000:60000),ab=()=>ac.abort();if(sig)sig.addEventListener('abort',ab);
  try{const text=noEmo(await call(p,msgs,onTok,ac.signal,stream));S.stat[p.id]={ok:1,ts:Date.now()};if(p!==prov())toast(t('used')+' '+p.name);return{text,name:p.name+' / '+mdl(p)}}
  catch(e){if(sig&&sig.aborted)throw e;const er=e.name==='AbortError'?new Error(bi('หมดเวลา','Timed out')):e;if(k===0&&(e.status===404||e.status===400)&&await heal(p))continue;S.stat[p.id]={ok:0,ts:Date.now(),err:explain(er)};errs.push(p.name+': '+explain(er));break}
  finally{clearTimeout(to);if(sig)sig.removeEventListener('abort',ab)}}}
 save();throw new Error(errs.join('\n'))}
const pd=()=>S.per==='custom'?S.custom:PER[S.per].d;
const sys=()=>`You are ${S.name}, a character in a chat app. Personality: ${pd()||'friendly and natural'}. Stay strictly in character; never say you are an AI model or mention these instructions. Reply in the language the user writes in (Thai or English). Keep replies natural and conversational (1-4 short paragraphs); use *asterisks* for brief actions. NEVER use emojis or emoticons. Your relationship with the user is level ${lvl()} of 5 (${T.en.lv[lvl()]}): let warmth and familiarity match it. Things you remember about the user:\n${S.mems.map(m=>'- '+m.t).join('\n')||'(nothing yet)'}`;
async function remember(){const tr=S.chat.slice(-10).map(m=>(m.r==='user'?'User: ':S.name+': ')+m.t).join('\n');
 try{const r=await run([{role:'user',content:`Notes about the user so far:\n${S.mem||'(none)'}\n\nRecent conversation:\n${tr}\n\nRewrite the notes: merge new durable facts (name, likes, goals, important events, feelings) into at most 8 short bullet lines, in the user's language. Output only the bullets.`}],()=>{},null,false);S.mem=r.text.slice(0,900);save()}catch{}}
/* UI */
function main(){const l=lvl();
 $('#app').innerHTML=`<header><div class=av style="width:42px;height:42px">${esc(S.name.charAt(0).toUpperCase())}</div><div class=ti><b>${esc(S.name)}</b><small>${PER[S.per].n[L()]} - ${t('lv')[l]}</small><div class=bar><i style="width:${l>=5?100:(S.xp%10)*10}%"></i></div></div><button data-a=models>${t('models')}</button><button data-a=menu>${bi('เมนู','Menu')}</button></header>
<div id=msgs></div><div id=err hidden></div><div id=eb hidden></div><div id=act hidden></div><div class=tb><button data-a=agent id=ag class="${S.agent?'on':''}">Agent: ${S.agent?'ON':'OFF'}</button><button data-a=attach>${bi('แนบไฟล์','Files')}</button><span class=fc id=fc data-a=fclear></span></div><footer><textarea id=in rows=1 placeholder="${t('ph')}"></textarea><button data-a=mic id=mic>${bi('พูด','Mic')}</button><button class=p data-a=send id=sb>${t('save')==='บันทึก'?'ส่ง':'Send'}</button></footer>`;
 const i=$('#in');i.oninput=()=>{i.style.height='auto';i.style.height=i.scrollHeight+'px'};
 i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send()}};draw();micUI();fcDraw();actDraw()}
function draw(){const ch=S.chat;$('#msgs').innerHTML=ch.length?ch.map((m,i)=>`<div class="m ${m.r==='user'?'u':'a'}"><div class=b>${fmt(m.t)}</div><div class=ma>${m.r==='user'?(busy?'':`<button data-a=edit data-i=${i}>${t('edit')}</button>`):`<span>${esc(m.m||'')}</span>${i===ch.length-1&&!busy?`<button data-a=regen>${t('regen')}</button>`:''}`}</div></div>`).join(''):`<div class=empty><div class=av style="width:84px;height:84px;font-size:2rem;margin:0 auto 10px">${esc(S.name.charAt(0).toUpperCase())}</div>${esc(S.name)}<br>${t('hi')}</div>`;scr()}
const scr=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight};
function setSb(){const b=$('#sb');if(!b)return;b.textContent=busy?t('stop'):(S.lang==='th'?'ส่ง':'Send');b.dataset.a=busy?'stop':'send'}
function showErr(m){const e=$('#err');if(!e)return;e.hidden=!m;e.innerHTML=m?esc(m)+' <button data-a=regen style="padding:3px 10px">'+t('retry')+'</button>':''}
function send(){const i=$('#in'),v=i.value.trim();if(!v||busy)return;
 if(editIdx!=null){S.chat.splice(editIdx);editIdx=null;$('#eb').hidden=true}
 S.chat.push({r:'user',t:v});S.xp++;i.value='';i.style.height='auto';save();draw();return gen()}
async function gen(){if(busy)return;if(S.agent)return agentRun();busy=true;setSb();showErr('');
 if(S.chat.length&&S.chat[S.chat.length-1].r==='assistant')S.chat.pop();draw();
 const box=document.createElement('div');box.className='m a';box.innerHTML='<div class=b><span class=dots><i></i><i></i><i></i></span></div>';$('#msgs').append(box);scr();
 ctl=new AbortController();let part='';
 try{const r=await run([{role:'system',content:sys()},...S.chat.slice(-24).map(m=>({role:m.r,content:m.t}))],x=>{part=x;box.firstChild.innerHTML=fmt(x);scr()},ctl.signal,true);
  S.chat.push({r:'assistant',t:r.text,m:r.name})}
 catch(e){if(e.name==='AbortError'){if(part)S.chat.push({r:'assistant',t:noEmo(part),m:'stopped'})}else showErr(e.message)}
 busy=false;save();setSb();draw();
 const lm=S.chat[S.chat.length-1];if((S.voice.speak||vmode)&&lm&&lm.r==='assistant')await speak(lm.t)}
/* sheets */
function modal(h){closeM();const d=document.createElement('div');d.id='md';d.innerHTML=`<div class=sh>${h}</div>`;d.onclick=e=>{if(e.target===d)closeM()};document.body.append(d)}
const closeM=()=>{const d=$('#md');if(d)d.remove()};
function persona(){modal(`<h2>${t('persona')}</h2><div><label>${t('name')}</label><input id=f-name value="${esc(S.name)}" maxlength=30></div>

open_app:{d:'Launch an installed app by name ('+Object.keys(APPS).join(', ')+') or Android package name. "settings" opens the Settings app home only.',a:'name',n:'Android app build; Android must allow seeing the app',run:async a=>{const k=String(a.name||'').toLowerCase().trim(),pk=APPS[k]||(k.includes('.')?k:null);if(!pk)throw new Error('Unknown app. Known: '+Object.keys(APPS).join(', '));const L=pl('AppLauncher');const c=await L.canOpenUrl({url:pk});if(!c.value)throw new Error(pk+' is not installed or Android hides it');await L.openUrl({url:pk});return 'Opened '+pk}},

const asys=()=>`You are ${S.name}, a personal assistant AGENT on an Android phone. Personality for your wording: ${pd()||'friendly'}. Reply in the user's language (Thai or English). NEVER use emojis.
Now: ${new Date().toString()}
Reply with ONLY one JSON object per turn, no other text:
{"say":"short note on what you do","plan":["short steps"],"tool":"<name>","args":{}}  to use a tool
{"final":"answer for the user"}  when finished
{"ask":"clarifying question"}  only if you truly need more information
Rules: one tool per turn; use observations, never invent results; if a tool fails, try another way or say so honestly; never claim abilities that no tool provides; datetimes as "YYYY-MM-DD HH:MM" local time; at most 8 steps; keep the final answer short and in your personality.
Tools:
${Object.entries(TOOLS).filter(([k])=>!S.off[k]).map(([k,v])=>'- '+k+'('+v.a+'): '+v.d).join('\n')}
User memory:
${S.mems.slice(0,30).map(m=>'- '+m.t).join('\n')||'(none)'}
Unfinished earlier tasks:
${S.tasks.filter(x=>['waiting','cancelled','failed'].includes(x.st)).slice(0,3).map(x=>'- '+x.t).join('\n')||'(none)'}
Attached files: ${FILES.map(f=>f.name).join(', ')||'(none)'}`;
function parseJ(t){const m=t.replace(/```json|```/g,''),a=m.indexOf('{'),b=m.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(m.slice(a,b+1))}catch{}return{final:noEmo(t)}}
const confirmStep=st=>new Promise(res=>{pend={st,res};actDraw()});
const SL={pending:['รอ','Waiting'],running:['กำลังทำ','Running'],done:['เสร็จ','Done'],failed:['ล้มเหลว','Failed'],denied:['ปฏิเสธ','Denied'],cancelled:['ยกเลิก','Cancelled']};
function actDraw(){const e=$('#act');if(!e)return;if(!task||task.hide){e.hidden=true;return}e.hidden=false;const run=task.st==='running';
 e.innerHTML=`<div class=ah><b>Agent</b><span class=lim>${run?bi('กำลังทำงาน','Working'):esc(task.st)}</span>${run?`<button data-a=stop>${bi('ยกเลิก','Cancel')}</button>`:`<button data-a=hideact>${bi('ซ่อน','Hide')}</button>`}</div>`
 +(task.plan?`<div class=lim>${task.plan.map(x=>esc(String(x))).join(' > ')}</div>`:'')
 +task.steps.map(s=>`<div class=stp><span class="sl s-${s.st}">${bi(SL[s.st][0],SL[s.st][1])}</span><div><b>${esc(s.tool)}</b> <code>${esc(JSON.stringify(s.args))}</code>${s.why?`<div class=lim>${esc(s.why)}</div>`:''}${s.res?`<div class=lim>${esc(s.res)}</div>`:''}</div></div>`).join('')
 +(pend?`<div class=cf><b>${bi('อนุญาตการกระทำนี้ไหม','Allow this action?')}</b><div class=lim>${esc(pend.st.tool)} ${esc(JSON.stringify(pend.st.args))}</div><div class=row><button class=p data-a=allow>${bi('อนุญาต','Allow')}</button><button data-a=deny>${bi('ปฏิเสธ','Deny')}</button></div></div>`:'');
 e.scrollTop=e.scrollHeight}
async function notify(body){try{const p=NP();if(!p||!p.LocalNotifications)return;const LN=p.LocalNotifications;if((await LN.checkPermissions()).display!=='granted')return;await LN.schedule({notifications:[{id:Math.floor(Date.now()%2e9),title:S.name,body:body.slice(0,120),schedule:{at:new Date(Date.now()+800)}}]})}catch{}}
async function agentRun(){if(busy)return;busy=true;setSb();showErr('');
 if(S.chat.length&&S.chat[S.chat.length-1].r==='assistant')S.chat.pop();draw();
 const ut=S.chat[S.chat.length-1].t;task={id:Date.now(),t:ut,steps:[],st:'running'};S.tasks.unshift(task);S.tasks=S.tasks.slice(0,20);
 ctl=new AbortController();actDraw();save();
 const msgs=[{role:'system',content:asys()},...S.chat.slice(-14).map(m=>({role:m.r,content:m.t}))];let out='',name='',ask=false;
 try{for(let i=0;i<8;i++){if(task.cancel)throw 'cancel';
   const r=await run(msgs,()=>{},ctl.signal,false);name=r.name;const o=parseJ(r.text);msgs.push({role:'assistant',content:r.text});
   if(Array.isArray(o.plan)&&!task.plan)task.plan=o.plan.slice(0,6);
   if(!o.tool){out=String(o.final!=null?o.final:o.ask!=null?o.ask:o.say||r.text);ask=o.ask!=null;break}
   const tl=TOOLS[o.tool],st={tool:String(o.tool),args:o.args||{},st:'pending',why:o.say||''};task.steps.push(st);actDraw();let obs;
   if(!tl||S.off[o.tool]){st.st='failed';obs='Unknown or disabled tool: '+o.tool;st.res=obs}
   else{let ok=true;if(tl.sens||S.confirmAll){ok=await confirmStep(st);if(task.cancel)throw 'cancel'}
    if(!ok){st.st='denied';obs='The user denied this action. Do not retry it; offer an alternative or finish.'}
    else{st.st='running';actDraw();try{obs=await Promise.race([tl.run(st.args),new Promise((_,j)=>setTimeout(()=>j(new Error('tool timeout')),60000))]);st.st='done';st.res=String(obs).slice(0,300)}catch(e){st.st='failed';obs='Error: '+(e.message||e);st.res=obs}}}
   actDraw();msgs.push({role:'user',content:'Observation from '+o.tool+': '+String(obs).slice(0,3000)})}
  if(!out)out=bi('ทำได้ไม่ครบภายในจำนวนขั้นตอนที่กำหนด ดูความคืบหน้าในแผง Agent แล้วสั่งต่อได้','I reached the step limit before finishing. See the Agent panel and tell me to continue.');
  task.st=ask?'waiting':(task.steps.some(s=>s.st==='failed')&&!task.steps.some(s=>s.st==='done')?'failed':'done')}
 catch(e){if(task.cancel||e==='cancel'||(e&&e.name==='AbortError'))task.st='cancelled';else{task.st='failed';showErr((e&&e.message)||String(e))}}
 const n=task.steps.filter(s=>s.st==='done').length;pend=null;
 if(out)S.chat.push({r:'assistant',t:noEmo(out),m:name+(n?' - '+n+' '+bi('การกระทำ','actions'):'')});
 busy=false;save();setSb();draw();actDraw();
 if(out&&document.hidden)notify(out);
 if(out&&(S.voice.speak||vmode))await speak(out)}

async function speak(text){text=noEmo(text).replace(/[*_#`>~]/g,' ');if(!text.trim())return;const lang=/[\u0E00-\u0E7F]/.test(text)?'th-TH':'en-US';
 try{const p=NP();if(p&&p.TextToSpeech){if(!VOICES.length)await loadVoices();const o={text,lang,rate:S.voice.rate,queueStrategy:0},v=VOICES[S.voice.vi];if(v&&v.lang&&v.lang.slice(0,2).toLowerCase()===lang.slice(0,2))o.voice=S.voice.vi;await p.TextToSpeech.speak(o)}
  else if(window.speechSynthesis)await new Promise(r=>{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=S.voice.rate;u.onend=u.onerror=r;speechSynthesis.cancel();speechSynthesis.speak(u)})}
 catch(e){toast('Voice: '+(e.message||e))}}
function stopSpeak(){try{const p=NP();if(p&&p.TextToSpeech)p.TextToSpeech.stop();else if(window.speechSynthesis)speechSynthesis.cancel()}catch{}}
async function listenOnce(){const p=NP(),R=p&&p.SpeechRecognition;
 if(R){let pm=await R.checkPermissions();if(pm.speechRecognition!=='granted')pm=await R.requestPermissions();if(pm.speechRecognition!=='granted')throw new Error(bi('ไม่ได้รับสิทธิ์ไมโครโฟน','Microphone permission denied'));
  if(!(await R.available()).available)throw new Error(bi('เครื่องนี้ไม่มีบริการแปลงเสียงเป็นข้อความ','Speech recognition is not available on this phone'));
  return new Promise(async(res,rej)=>{let last='',done=false,h1,h2;const fin=()=>{if(done)return;done=true;h1&&h1.remove();h2&&h2.remove();res(last)};
   h1=await R.addListener('partialResults',e=>{last=(e.matches&&e.matches[0])||last;$('#in').value=last});
   h2=await R.addListener('listeningState',e=>{if(e.status==='stopped')setTimeout(fin,350)});
   recStop=()=>R.stop().catch(()=>{});
   try{await R.start({language:lcode(),maxResults:1,partialResults:true,popup:false})}catch(e){done=true;h1.remove();h2.remove();rej(e)}})}
 const W=window.SpeechRecognition||window.webkitSpeechRecognition;if(!W)throw new Error(bi('เบราว์เซอร์นี้ไม่รองรับเสียงพูด ใช้แอป Android แทน','Speech input is not supported here; use the Android app'));
 return new Promise((res,rej)=>{const r=new W();r.lang=lcode();r.interimResults=true;let last='';r.onresult=e=>{last=[...e.results].map(x=>x[0].transcript).join('');$('#in').value=last};r.onerror=e=>rej(new Error(e.error));r.onend=()=>res(last);recStop=()=>r.stop();r.start()})}
function micUI(){const b=$('#mic');if(!b)return;b.textContent=vmode?bi('หยุด','Stop'):bi('พูด','Mic');b.className=vmode?'on':''}
async function vloop(){vmode=true;micUI();
 try{while(vmode){const txt=(await listenOnce()).trim();if(!vmode)break;if(!txt){if(!S.voice.hands)break;continue}$('#in').value=txt;await send();if(!S.voice.hands)break}}
 catch(e){toast(e.message||String(e))}
 vmode=false;micUI()}
function fcDraw(){const e=$('#fc');if(e)e.textContent=FILES.length?FILES.length+' '+bi('ไฟล์','file(s)'):''}
/* ---------- menu ---------- */
const LB={persona:['บุคลิก','Persona'],voice:['เสียง','Voice'],memory:['ความจำ','Memory'],notes:['โน้ต','Notes'],tasks:['งาน','Tasks'],tools:['เครื่องมือ','Tools'],access:['สิทธิ์','Access']};
function menu(tab){tab=tab||'voice';let b='';const ck=(id,v,l)=>`<label class=row style="color:var(--tx)"><input type=checkbox id=${id} ${v?'checked':''} style="width:auto"> ${l}</label>`;
 if(tab==='voice')b=ck('v-speak',S.voice.speak,bi('อ่านคำตอบออกเสียง','Speak replies aloud'))+ck('v-hands',S.voice.hands,bi('โหมดแฮนด์ฟรี: ฟังต่อเนื่องหลังตอบ (กดปุ่มพูดเพื่อหยุด)','Hands-free: keep listening after each reply (tap Stop to end)'))+`<div><label>${bi('ความเร็วเสียง','Speaking speed')}: <span id=rv>${S.voice.rate}</span></label><input type=range id=v-rate min=.5 max=1.5 step=.1 value=${S.voice.rate}></div><div><label>${bi('เสียง','Voice')}</label><select id=v-sel><option value=-1>${bi('ค่าเริ่มต้นของเครื่อง','Device default')}</option></select></div><button data-a=vtest>${bi('ทดสอบเสียง','Test voice')}</button><p class=lim>${bi('ฟังและพูดตามภาษาแอป (ไทย/อังกฤษ) ต้องมีเสียงภาษานั้นติดตั้งในเครื่อง','Listening follows the app language (Thai/English). The matching voice must be installed on the phone.')}</p>`;
 else if(tab==='memory')b=`<p class=lim>${bi('AI จะถามก่อนบันทึกความจำเสมอ อย่าเก็บรหัสผ่านหรือข้อมูลอ่อนไหว','The AI always asks before saving a memory. Do not store passwords or sensitive data.')}</p>${S.mems.map(m=>`<div class=pv><textarea rows=2 data-me="${m.id}">${esc(m.t)}</textarea><button data-a=memdel data-id="${m.id}">${bi('ลบ','Delete')}</button></div>`).join('')}<div class=row><input id=mnew placeholder="${bi('เพิ่มความจำ','Add memory')}" style="flex:1"><button data-a=memadd class=p>+</button></div>`;
 else if(tab==='notes')b=S.notes.map(n=>`<div class=pv><input data-nt="${n.id}" value="${esc(n.title)}"><textarea rows=3 data-nb="${n.id}">${esc(n.text)}</textarea><button data-a=notedel data-id="${n.id}">${bi('ลบ','Delete')}</button></div>`).join('')+`<button data-a=noteadd class=p>${bi('โน้ตใหม่','New note')}</button>`;
 else if(tab==='tasks')b=S.tasks.length?S.tasks.map(x=>`<div class=pv><div>${esc(x.t)}</div><div class=lim>${esc(x.st)} / ${new Date(x.id).toLocaleString()} / ${x.steps.length} ${bi('ขั้นตอน','actions')}</div><div class=row>${x.st!=='done'?`<button data-a=tres data-id="${x.id}">${bi('ทำต่อ','Resume')}</button>`:''}<button data-a=tdel data-id="${x.id}">${bi('ลบ','Delete')}</button></div></div>`).join(''):`<p class=lim>${bi('ยังไม่มีงาน','No tasks yet')}</p>`;
 else if(tab==='tools')b=Object.entries(TOOLS).map(([k,v])=>`<div class=pv><label class=row style="color:var(--tx)"><input type=checkbox data-to="${k}" ${S.off[k]?'':'checked'} style="width:auto"><b>${k}</b>${v.sens?`<span class=tag>${bi('ถามก่อน','asks first')}</span>`:''}</label><div class=lim>${esc(v.d)}</div><div class=lim>${bi('ต้องการ','Needs')}: ${esc(v.n)}</div></div>`).join('')+ck('cf-all',S.confirmAll,bi('ถามยืนยันก่อนทุกการกระทำ','Ask before every action'));
 else if(tab==='access')b=`<div class=pv id=perm></div><div class=row><button data-a=reqmic>${bi('ขอสิทธิ์ไมโครโฟน','Request microphone')}</button><button data-a=reqnot>${bi('ขอสิทธิ์แจ้งเตือน','Request notifications')}</button></div><p class=lim>${bi('เปิดแอป: ใช้ได้กับแอปที่ Android ให้แอปนี้มองเห็น. ปฏิทิน: เปิดแอปปฏิทินพร้อมข้อมูลกิจกรรม คุณต้องกดบันทึกเอง ไม่มีการเข้าถึงปฏิทินแบบเงียบ. ไฟล์: อ่านเฉพาะไฟล์ข้อความที่คุณแนบ ไม่แก้ไขหรือย้ายไฟล์ในเครื่อง. การตั้งค่า: เปิดได้แค่หน้าแรกของแอปตั้งค่า. พื้นหลัง: Agent ทำงานตอนเปิดแอปเท่านั้น ส่วนเตือนความจำใช้ระบบปลุกของ Android. ข้อความ: ไม่ส่งเองอัตโนมัติ การแชร์จะเปิดหน้าต่างแชร์ให้คุณเลือก','Open apps: works for apps Android lets this app see. Calendar: opens the Calendar app with the event prefilled and you tap Save; no silent calendar access. Files: only text files you attach; nothing on the device is changed or moved. Settings: only the Settings app home page opens. Background: the agent runs only while the app is open; reminders use Android alarms. Messages: nothing is sent automatically; sharing opens the share sheet for you to choose.')}</p>`;
 modal(`<div class=row style="flex-wrap:nowrap;overflow-x:auto">${Object.keys(LB).map(k=>`<button data-a=tab data-id=${k} class="${k===tab?'on':''}">${LB[k][L()?0:1]}</button>`).join('')}</div>${b}<button data-a=close class=p>OK</button>`);
 if(tab==='voice')loadVoices().then(v=>{const s=$('#v-sel');if(!s)return;v.forEach((x,i)=>s.insertAdjacentHTML('beforeend',`<option value=${i} ${i===S.voice.vi?'selected':''}>${esc(x.name+' ('+x.lang+')')}</option>`))});
 if(tab==='access')accessStatus()}
async function accessStatus(){const p=NP(),o=[[bi('แอป Android','Android app'),p?'OK':bi('เบราว์เซอร์ (เครื่องมือเครื่องใช้ไม่ได้)','Browser (device tools unavailable)')]];
 try{if(p&&p.SpeechRecognition)o.push([bi('ไมโครโฟน','Microphone'),(await p.SpeechRecognition.checkPermissions()).speechRecognition])}catch{}
 try{if(p&&p.LocalNotifications)o.push([bi('การแจ้งเตือน','Notifications'),(await p.LocalNotifications.checkPermissions()).display])}catch{}
 const e=$('#perm');if(e)e.innerHTML=o.map(x=>`<div class=row><b style="flex:1">${x[0]}</b><span>${esc(x[1])}</span></div>`).join('')}
const statTxt=p=>{const s=S.stat[p.id];return s?(s.ok?bi('เชื่อมต่อล่าสุด: สำเร็จ ','Last call: OK '):bi('เชื่อมต่อล่าสุดล้มเหลว: ','Last call failed: ')+(s.err||'')+' ')+new Date(s.ts).toLocaleTimeString():bi('ยังไม่เคยเรียก','No calls yet')};
/* ---------- events ---------- */
document.body.insertAdjacentHTML('beforeend','<input type=file id=fi multiple hidden accept="text/*,.md,.csv,.json,.txt,.log,.xml,.html,.yml,.yaml">');
$('#fi').onchange=async e=>{for(const f of e.target.files){try{if(f.size>2e6||/\.(pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|zip|apk)$/i.test(f.name))throw 0;FILES.push({name:f.name,text:await f.text()})}catch{toast(f.name+': '+bi('รองรับเฉพาะไฟล์ข้อความไม่เกิน 2MB','text files up to 2 MB only'))}}e.target.value='';fcDraw()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==='menu')menu();else if(a==='tab'){if(id==='persona'){persona()}else menu(id)}
 else if(a==='agent'){S.agent=!S.agent;save();const b=$('#ag');b.textContent='Agent: '+(S.agent?'ON':'OFF');b.className=S.agent?'on':''}
 else if(a==='attach')$('#fi').click();else if(a==='fclear'){FILES.length=0;fcDraw()}
 else if(a==='mic'){if(vmode){vmode=false;stopSpeak();recStop&&recStop();micUI()}else vloop()}
 else if(a==='stop'){if(task&&task.st==='running')task.cancel=true;if(pend){const r=pend.res;pend=null;r(false)}stopSpeak()}
 else if(a==='allow'||a==='deny'){if(pend){const r=pend.res;pend=null;r(a==='allow');actDraw()}}
 else if(a==='hideact'){task.hide=true;actDraw()}
 else if(a==='memadd'){const v=$('#mnew').value.trim();if(v){S.mems.push({id:id_(),t:v});save();menu('memory')}}
 else if(a==='memdel'){S.mems=S.mems.filter(m=>m.id!==id);save();menu('memory')}
 else if(a==='noteadd'){S.notes.unshift({id:id_(),title:bi('โน้ตใหม่','New note'),text:'',ts:Date.now()});save();menu('notes')}
 else if(a==='notedel'){S.notes=S.notes.filter(n=>n.id!==id);save();menu('notes')}
 else if(a==='tres'){const x=S.tasks.find(q=>String(q.id)===id);if(x){closeM();$('#in').value=bi('ทำงานนี้ต่อ: ','Continue this task: ')+x.t;$('#in').focus()}}
 else if(a==='tdel'){S.tasks=S.tasks.filter(q=>String(q.id)!==id);save();menu('tasks')}
 else if(a==='reqmic'){const p=NP();(p&&p.SpeechRecognition?p.SpeechRecognition.requestPermissions():Promise.reject(new Error('Android app only'))).then(accessStatus).catch(x=>toast(x.message))}
 else if(a==='reqnot'){const p=NP();(p&&p.LocalNotifications?p.LocalNotifications.requestPermissions():Promise.reject(new Error('Android app only'))).then(accessStatus).catch(x=>toast(x.message))}
 else if(a==='vtest')speak(bi('สวัสดีค่ะ นี่คือเสียงทดสอบ','Hello, this is a voice test.'))});
document.addEventListener('change',e=>{const d=e.target.dataset,i=e.target.id;
 if(d.me){const m=S.mems.find(x=>x.id===d.me);if(m){m.t=e.target.value.trim()||m.t;save()}}
 else if(d.nt){const n=S.notes.find(x=>x.id===d.nt);if(n){n.title=e.target.value;save()}}
 else if(d.nb){const n=S.notes.find(x=>x.id===d.nb);if(n){n.text=e.target.value;save()}}
 else if(d.to){if(e.target.checked)delete S.off[d.to];else S.off[d.to]=1;save()}
 else if(i==='cf-all'){S.confirmAll=e.target.checked;save()}
 else if(i==='v-speak'){S.voice.speak=e.target.checked;save()}
 else if(i==='v-hands'){S.voice.hands=e.target.checked;if(e.target.checked)S.voice.speak=true;save()}
 else if(i==='v-rate'){S.voice.rate=+e.target.value;$('#rv').textContent=S.voice.rate;save()}
 else if(i==='v-sel'){S.voice.vi=+e.target.value;save()}});

main();
</script></body></html>
