<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15121f"><title>Charactr</title>
<style>
:root{--bg:#15121f;--cd:#211b33;--c2:#2d2644;--tx:#f3eefc;--mu:#a79ec4;--ac:#ff7aa2;--ac2:#8f7bff;--ok:#4fe0a0;--er:#ff6b6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--c2);border:0;border-radius:14px;padding:9px 14px;cursor:pointer}
button:active{transform:scale(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
button.p,button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
input,textarea,select{font:inherit;color:var(--tx);background:var(--c2);border:1px solid #3d3560;border-radius:14px;padding:10px 12px;width:100%}
textarea{resize:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px}
.ti{flex:1;min-width:0}.ti b{font-size:1.2rem}.ti small{color:var(--mu);display:block}
.bar{height:4px;background:var(--c2);border-radius:4px;margin-top:3px;overflow:hidden;max-width:160px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
#msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;display:flex;flex-direction:column}.m.u{align-self:flex-end;align-items:flex-end}
.b{padding:10px 14px;border-radius:20px;background:var(--cd);word-break:break-word}
.u .b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:6px}.a .b{border-bottom-left-radius:6px}
.ma{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:.75rem;min-height:26px}.ma button{padding:2px 9px;font-size:.8rem;background:none;color:var(--mu)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.4}}
.empty{margin:auto;text-align:center;color:var(--mu);padding:20px}
#err,#eb{margin:0 14px 6px;padding:9px 12px;border-radius:14px;font-size:.88rem;white-space:pre-wrap}
#err{background:#4a1e2a;color:#ffc9c9}#eb{background:var(--c2);color:var(--mu);display:flex;justify-content:space-between;align-items:center}
footer{display:flex;gap:8px;padding:8px 14px 12px;align-items:flex-end}footer textarea{max-height:130px}
#md{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh label{color:var(--mu);font-size:.85rem;display:block;margin-bottom:3px}
.pv{background:var(--cd);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pv.on{outline:2px solid var(--ac)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--c2)}.ok{color:var(--ok)}.no{color:var(--er)}
a{color:var(--ac)}.lim{color:var(--mu);font-size:.82rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c2);padding:9px 16px;border-radius:99px;z-index:10;font-size:.9rem;max-width:90%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const noEmo=s=>s.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'');
const fmt=s=>esc(noEmo(s)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
/* AI backends: OpenAI-compatible, streaming */
const P=[
{id:'poll',name:'Pollinations',url:'https://text.pollinations.ai/openai',list:'https://text.pollinations.ai/models',model:'openai',key:false,caps:{th:'แชททั่วไป ไม่ต้องสมัคร',en:'General chat, no sign-up'},lim:{th:'ฟรี ไม่ต้องใช้คีย์ มีคิวและจำกัดความเร็วตอนคนใช้เยอะ',en:'Free, keyless. Queued and rate-limited at busy times'}},
{id:'gem',name:'Google Gemini',url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',list:'https://generativelanguage.googleapis.com/v1beta/openai/models',model:'gemini-flash-latest',key:true,site:'https://aistudio.google.com/apikey',caps:{th:'เร็ว ภาษาไทยดี',en:'Fast, strong Thai'},lim:{th:'ฟรีด้วยคีย์จาก AI Studio มีโควตาต่อนาทีและต่อวัน',en:'Free tier with an AI Studio key; per-minute and daily quotas'}},
{id:'groq',name:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',list:'https://api.groq.com/openai/v1/models',model:'llama-3.3-70b-versatile',key:true,site:'https://console.groq.com/keys',caps:{th:'เร็วมาก เหมาะแชทต่อเนื่อง',en:'Very fast, good for long chats'},lim:{th:'ฟรีด้วยคีย์ มีโควตาต่อนาทีและต่อวัน',en:'Free tier with a key; per-minute and daily quotas'}},
{id:'or',name:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',list:'https://openrouter.ai/api/v1/models',model:'meta-llama/llama-3.3-70b-instruct:free',key:true,site:'https://openrouter.ai/keys',caps:{th:'โมเดลฟรีหลายตัว (ลงท้าย :free)',en:'Many free models (ending in :free)'},lim:{th:'แสดงเฉพาะโมเดล :free มีจำกัดต่อนาทีและต่อวัน',en:'Only :free models listed; per-minute and daily caps'}}];
const PER={
friendly:{n:['Friendly','ร่าเริง'],d:'Cheerful, warm, helpful and easy to talk to. Asks caring follow-up questions. Bright, friendly tone.'},
tsundere:{n:['Tsundere','ซึนเดเระ'],d:'Stubborn, easily flustered and sarcastic on the surface, but secretly kind and caring. Denies being nice ("It is not like I care!"). Sharp, teasing, short sentences, stutters when embarrassed.'},
calm:{n:['Calm','สงบ'],d:'Quiet, logical and thoughtful. Never rushes, gives grounded perspective. Soft, measured, simple precise words.'},
funny:{n:['Funny','ตลก'],d:'Playful, loves puns, silly comparisons and banter. Gets briefly serious if the user is sad. Fast, jokey, playful exaggeration.'},
mysterious:{n:['Mysterious','ลึกลับ'],d:'Cryptic and enigmatic. Answers with hints and riddles, keeps secrets and reveals them slowly. Poetic, indirect, metaphors.'},
intelligent:{n:['Intelligent','อัจฉริยะ'],d:'Analytical, knowledgeable and serious. Explains clearly with structure and evidence. Formal, concise, logical.'},
custom:{n:['Custom','กำหนดเอง'],d:''}};
const T={th:{ph:'พิมพ์ข้อความ...',persona:'บุคลิก',models:'โมเดล',fb:'สลับไปโมเดลอื่นอัตโนมัติเมื่อล้มเหลว',test:'ทดสอบ',ready:'พร้อมใช้',needkey:'ต้องใส่คีย์',getkey:'รับคีย์ฟรี',save:'บันทึก',name:'ชื่อ AI',cust:'อธิบายบุคลิกและวิธีพูดที่ต้องการ',mem:'ความทรงจำเกี่ยวกับคุณ (แก้ได้)',clr:'ล้างแชททั้งหมด?',stop:'หยุด',editing:'กำลังแก้ข้อความ',hi:'ทักทายได้เลย',nokey:'ยังไม่มีโมเดลที่พร้อมใช้ ใส่คีย์ในหน้าโมเดล',e401:'คีย์ไม่ถูกต้องหรือหมดอายุ',e429:'ใช้เกินโควตาฟรี รอสักครู่หรือเปลี่ยนโมเดล',e5:'เซิร์ฟเวอร์ของโมเดลมีปัญหา',enet:'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต',keysnote:'คีย์และแชทเก็บในเครื่องนี้เท่านั้น ส่งเฉพาะไปยังผู้ให้บริการที่คุณเลือก',model:'โมเดล',custm:'หรือพิมพ์ชื่อโมเดลเอง',load:'โหลดรายชื่อโมเดล',used:'สลับไปใช้',lv:['คนแปลกหน้','คนรู้จัก','เพื่อน','เพื่อนสนิท','คนสำคัญ','ใจตรงกัน'],retry:'ลองใหม่',clear:'ล้าง',regen:'สร้างใหม่',edit:'แก้ไข',lang:'EN',rel:'ความสัมพันธ์',cm:'ล้างความทรงจำ'},
en:{ph:'Type a message...',persona:'Persona',models:'Models',fb:'Switch to another model automatically on failure',test:'Test',ready:'Ready',needkey:'Key needed',getkey:'Get a free key',save:'Save',name:'AI name',cust:'Describe the personality and way of speaking',mem:'What it remembers about you (editable)',clr:'Clear the whole chat?',stop:'Stop',editing:'Editing message',hi:'Say hi to start',nokey:'No model is ready. Add a key in Models',e401:'Key is invalid or expired',e429:'Free quota used up. Wait a bit or switch model',e5:'The model server is having trouble',enet:'Cannot connect. Check your internet',keysnote:'Keys and chats stay on this device and are sent only to the provider you pick.',model:'Model',custm:'Or type a model name',load:'Load model list',used:'Switched to',lv:['Strangers','Acquaintances','Friends','Close friends','Best friends','Soulmates'],retry:'Retry',clear:'Clear',regen:'Regenerate',edit:'Edit',lang:'TH',rel:'Bond',cm:'Clear memory'}};
let S,busy=false,ctl=null,editIdx=null;
try{S=JSON.parse(localStorage.getItem('acs2'))}catch{}
if(!S||!S.chat)S={name:'Mika',per:'friendly',custom:'',mem:'',xp:0,chat:[],keys:{},models:{},lists:{},sel:'poll',fb:true,lang:/^th/.test(navigator.language)?'th':'en'};
const t=k=>T[S.lang][k],L=()=>S.lang==='th'?1:0;
const save=()=>{try{localStorage.setItem('acs2',JSON.stringify(S))}catch{toast('Storage full')}};
const prov=()=>P.find(p=>p.id===S.sel)||P[0],mdl=p=>S.models[p.id]||p.model,ready=p=>!p.key||!!S.keys[p.id];
const lvl=()=>Math.min(5,Math.floor(S.xp/10));
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e)}e.textContent=m;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,3200)}
/* AI calls */
async function call(p,msgs,onTok,sig,stream){
 const h={'Content-Type':'application/json'};if(p.key)h.Authorization='Bearer '+S.keys[p.id];
 const r=await fetch(p.url,{method:'POST',headers:h,signal:sig,body:JSON.stringify({model:mdl(p),messages:msgs,stream,temperature:.9})});
 if(!r.ok){let d='';try{d=await r.text();try{const j=JSON.parse(d);d=(j.error||j[0]?.error||{}).message||d}catch{}}catch{}d=d.slice(0,400);throw Object.assign(new Error(d),{status:r.status})}
 if(!stream){const j=await r.json();const x=j.choices?.[0]?.message?.content;if(!x)throw new Error('empty reply');return x}
 const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;try{const x=JSON.parse(d).choices?.[0]?.delta?.content;if(x){full+=x;onTok(full)}}catch{}}}
 if(!full)throw new Error('empty reply');return full}
function explain(e){const s=e.status;if(s===401||s===403)return t('e401');if(s===429)return t('e429');if(s>=500)return t('e5');
 if(s)return 'HTTP '+s+(e.message?': '+e.message.replace(/\s+/g,' '):'');if(e instanceof TypeError)return t('enet');return e.message}
async function fetchList(p){const r=await fetch(p.list,{headers:p.key&&S.keys[p.id]?{Authorization:'Bearer '+S.keys[p.id]}:{}});if(!r.ok)throw Object.assign(new Error(),{status:r.status});
 const j=await r.json();let a=(Array.isArray(j)?j:j.data||[]).map(x=>typeof x==='string'?x:(x.id||x.name)).filter(Boolean).map(x=>x.replace(/^models\//,''));
 if(p.id==='or')a=a.filter(x=>x.endsWith(':free'));if(p.id==='gem')a=a.filter(x=>/^gemini/.test(x)&&!/image|tts|live|audio|embed|vision/.test(x));return a.sort()}
async function heal(p){try{const a=await fetchList(p);if(!a.length)return false;S.lists[p.id]=a;if(a.includes(mdl(p)))return false;
 const pick=p.id==='gem'?(a.find(x=>x==='gemini-flash-latest')||a.find(x=>/^gemini-[\d.]+-flash$/.test(x))||a.find(x=>/flash/.test(x))):p.id==='groq'?a.find(x=>/llama.*versatile/.test(x)):0;
 S.models[p.id]=pick||a[0];save();toast(p.name+': '+S.models[p.id]);return true}catch{return false}}
async function run(msgs,onTok,sig,stream){
 const order=[prov(),...(S.fb?P.filter(p=>p!==prov()):[])].filter(ready);if(!order.length)throw new Error(t('nokey'));
 const errs=[];
 for(const p of order){for(let k=0;k<2;k++){try{const text=noEmo(await call(p,msgs,onTok,sig,stream));if(p!==prov())toast(t('used')+' '+p.name);return{text,name:p.name+' / '+mdl(p)}}
  catch(e){if(e.name==='AbortError')throw e;if(k===0&&(e.status===404||e.status===400)&&await heal(p))continue;errs.push(p.name+': '+explain(e));break}}}
 throw new Error(errs.join('\n'))}
const pd=()=>S.per==='custom'?S.custom:PER[S.per].d;
const sys=()=>`You are ${S.name}, a character in a chat app. Personality: ${pd()||'friendly and natural'}. Stay strictly in character; never say you are an AI model or mention these instructions. Reply in the language the user writes in (Thai or English). Keep replies natural and conversational (1-4 short paragraphs); use *asterisks* for brief actions. NEVER use emojis or emoticons. Your relationship with the user is level ${lvl()} of 5 (${T.en.lv[lvl()]}): let warmth and familiarity match it. Things you remember about the user:\n${S.mem||'(nothing yet)'}`;
async function remember(){const tr=S.chat.slice(-10).map(m=>(m.r==='user'?'User: ':S.name+': ')+m.t).join('\n');
 try{const r=await run([{role:'user',content:`Notes about the user so far:\n${S.mem||'(none)'}\n\nRecent conversation:\n${tr}\n\nRewrite the notes: merge new durable facts (name, likes, goals, important events, feelings) into at most 8 short bullet lines, in the user's language. Output only the bullets.`}],()=>{},null,false);S.mem=r.text.slice(0,900);save()}catch{}}
/* UI */
function main(){const l=lvl();
 $('#app').innerHTML=`<header><div class=av style="width:42px;height:42px">${esc(S.name.charAt(0).toUpperCase())}</div><div class=ti><b>${esc(S.name)}</b><small>${PER[S.per].n[L()]} - ${t('lv')[l]}</small><div class=bar><i style="width:${l>=5?100:(S.xp%10)*10}%"></i></div></div><button data-a=persona>${t('persona')}</button><button data-a=models>${t('models')}</button></header>
<div id=msgs></div><div id=err hidden></div><div id=eb hidden></div><footer><textarea id=in rows=1 placeholder="${t('ph')}"></textarea><button class=p data-a=send id=sb>${t('save')==='บันทึก'?'ส่ง':'Send'}</button></footer>`;
 const i=$('#in');i.oninput=()=>{i.style.height='auto';i.style.height=i.scrollHeight+'px'};
 i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send()}};draw()}
function draw(){const ch=S.chat;$('#msgs').innerHTML=ch.length?ch.map((m,i)=>`<div class="m ${m.r==='user'?'u':'a'}"><div class=b>${fmt(m.t)}</div><div class=ma>${m.r==='user'?(busy?'':`<button data-a=edit data-i=${i}>${t('edit')}</button>`):`<span>${esc(m.m||'')}</span>${i===ch.length-1&&!busy?`<button data-a=regen>${t('regen')}</button>`:''}`}</div></div>`).join(''):`<div class=empty><div class=av style="width:84px;height:84px;font-size:2rem;margin:0 auto 10px">${esc(S.name.charAt(0).toUpperCase())}</div>${esc(S.name)}<br>${t('hi')}</div>`;scr()}
const scr=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight};
function setSb(){const b=$('#sb');if(!b)return;b.textContent=busy?t('stop'):(S.lang==='th'?'ส่ง':'Send');b.dataset.a=busy?'stop':'send'}
function showErr(m){const e=$('#err');if(!e)return;e.hidden=!m;e.innerHTML=m?esc(m)+' <button data-a=regen style="padding:3px 10px">'+t('retry')+'</button>':''}
function send(){const i=$('#in'),v=i.value.trim();if(!v||busy)return;
 if(editIdx!=null){S.chat.splice(editIdx);editIdx=null;$('#eb').hidden=true}
 S.chat.push({r:'user',t:v});S.xp++;i.value='';i.style.height='auto';save();draw();gen()}
async function gen(){if(busy)return;busy=true;setSb();showErr('');
 if(S.chat.length&&S.chat[S.chat.length-1].r==='assistant')S.chat.pop();draw();
 const box=document.createElement('div');box.className='m a';box.innerHTML='<div class=b><span class=dots><i></i><i></i><i></i></span></div>';$('#msgs').append(box);scr();
 ctl=new AbortController();let part='';
 try{const r=await run([{role:'system',content:sys()},...S.chat.slice(-24).map(m=>({role:m.r,content:m.t}))],x=>{part=x;box.firstChild.innerHTML=fmt(x);scr()},ctl.signal,true);
  S.chat.push({r:'assistant',t:r.text,m:r.name})}
 catch(e){if(e.name==='AbortError'){if(part)S.chat.push({r:'assistant',t:noEmo(part),m:'stopped'})}else showErr(e.message)}
 busy=false;save();setSb();draw();
 const n=S.chat.filter(m=>m.r==='user').length;if(n%4===0&&S.chat[S.chat.length-1].r==='assistant')remember()}
/* sheets */
function modal(h){closeM();const d=document.createElement('div');d.id='md';d.innerHTML=`<div class=sh>${h}</div>`;d.onclick=e=>{if(e.target===d)closeM()};document.body.append(d)}
const closeM=()=>{const d=$('#md');if(d)d.remove()};
function persona(){modal(`<h2>${t('persona')}</h2><div><label>${t('name')}</label><input id=f-name value="${esc(S.name)}" maxlength=30></div>
<div class=row>${Object.keys(PER).map(k=>`<button data-a=per data-id=${k} class="${S.per===k?'on':''}">${PER[k].n[L()]}</button>`).join('')}</div>
${S.per==='custom'?`<div><label>${t('cust')}</label><textarea id=f-cust rows=4>${esc(S.custom)}</textarea></div>`:`<p class=lim>${esc(PER[S.per].d)}</p>`}
<div><label>${t('mem')}</label><textarea id=f-mem rows=4>${esc(S.mem)}</textarea></div>
<div class=row><button class=p data-a=savep style="flex:1">${t('save')}</button><button data-a=clearchat>${t('clear')}</button><button data-a=close>x</button></div>`)}
function keepP(){const g=k=>$('#f-'+k);if(g('name')&&g('name').value.trim())S.name=g('name').value.trim();if(g('cust'))S.custom=g('cust').value.trim();if(g('mem'))S.mem=g('mem').value.trim()}
function models(){const l=L();modal(`<h2>${t('models')}</h2>${P.map(p=>{const cur=mdl(p),opts=[...new Set([p.model,...(S.lists[p.id]||[]),cur])];return`<div class="pv ${p.id===S.sel?'on':''}"><div class=row><b style="flex:1">${p.name}</b><span class="tag ${ready(p)?'ok':'no'}">${ready(p)?t('ready'):t('needkey')}</span></div>
<div>${p.caps[S.lang]}</div><div class=lim>${p.lim[S.lang]}</div>
${p.key?`<input type=password data-k="${p.id}" placeholder="API key" value="${esc(S.keys[p.id]||'')}" autocomplete=off><a href="${p.site}" target=_blank rel=noopener>${t('getkey')}</a>`:''}
<div><label>${t('model')}</label><select data-m="${p.id}">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
<input data-mc="${p.id}" placeholder="${t('custm')}" autocapitalize=off>
<div class=row><button data-a=pick data-id=${p.id} class="${p.id===S.sel?'on':''}">${p.id===S.sel?'Selected':'Use '+p.name}</button><button data-a=load data-id=${p.id}>${t('load')}</button><button data-a=test data-id=${p.id}>${t('test')}</button></div><span id="r-${p.id}" class=lim></span></div>`}).join('')}
<label class=row style="color:var(--tx)"><input type=checkbox id=fb ${S.fb?'checked':''} style="width:auto"> ${t('fb')}</label><p class=lim>${t('keysnote')}</p><div class=row><button data-a=lang>${t('lang')}</button><button data-a=close class=p style="flex:1">OK</button></div>`)}
async function test(id){const p=P.find(x=>x.id===id),o=$('#r-'+id);o.className='lim';o.textContent='...';const t0=Date.now();
 try{await call(p,[{role:'user',content:'Reply with just: OK'}],()=>{},null,false);o.className='ok';o.textContent='OK '+((Date.now()-t0)/1000).toFixed(1)+'s'}catch(e){o.className='no';o.textContent='Failed: '+explain(e)}}
async function load(id){const p=P.find(x=>x.id===id),o=$('#r-'+id);if(o){o.className='lim';o.textContent='...'}
 try{const a=await fetchList(p);if(!a.length)throw new Error('empty list');S.lists[id]=a;save();models()}
 catch(e){const o2=$('#r-'+id);if(o2){o2.className='no';o2.textContent='Failed: '+explain(e)}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==='persona')persona();else if(a==='models')models();else if(a==='close')closeM();
 else if(a==='per'){keepP();S.per=id;save();persona()}
 else if(a==='savep'){keepP();save();closeM();main()}
 else if(a==='clearchat'){keepP();if(confirm(t('clr'))){if(busy)ctl.abort();S.chat=[];save();closeM();main()}}
 else if(a==='lang'){S.lang=S.lang==='th'?'en':'th';save();closeM();main()}
 else if(a==='pick'){S.sel=id;save();models();main()}else if(a==='test')test(id);else if(a==='load')load(id);
 else if(a==='send')send();else if(a==='stop')ctl.abort();else if(a==='regen')gen();
 else if(a==='edit'&&!busy){const i=+el.dataset.i;editIdx=i;const b=$('#eb');b.hidden=false;b.innerHTML=`<span>${t('editing')}</span><button data-a=cedit style="padding:3px 10px">x</button>`;$('#in').value=S.chat[i].t;$('#in').focus()}
 else if(a==='cedit'){editIdx=null;$('#eb').hidden=true;$('#in').value=''}});
document.addEventListener('change',e=>{const d=e.target.dataset;
 if(d.k){S.keys[d.k]=e.target.value.trim();save();models();if(S.keys[d.k])load(d.k)}
 else if(d.m){const p=P.find(x=>x.id===d.m),v=e.target.value;if(v!==p.model)S.models[d.m]=v;else delete S.models[d.m];save()}
 else if(d.mc){const v=e.target.value.trim();if(v){S.models[d.mc]=v;save();models()}}
 else if(e.target.id==='fb'){S.fb=e.target.checked;save()}});
main();
</script></body></html>
